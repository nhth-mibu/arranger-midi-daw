# Korg Pa arrangers. Korg Pa models play the GM bank on channels 1-16,
# with drums on channel 10. Factory voices use Korg bank select values; add
# them with a sound add-on for your model.
# Supported style files: Yamaha SFF1/SFF2 .sty/.prs, including Korg styles
# that were saved in the SFF format.
profile: 1
id: korg-pa
name: Korg Pa arrangers (GM)
maker: Korg
dialect: gm
ports: ["Korg", "Pa5X", "Pa4X", "Pa3X", "Pa1000", "Pa700", "Pa600", "Pa300", "Pa80"]
drumChannels: [10]
programBase: 1
mixer: { volume: 7, pan: 10, reverb: 91, chorus: 93 }
capabilities: { polyphony: 128, parts: 16, source: estimate }
reset:
  - "F0 7E 7F 09 01 F7"   # GM On
notes: >
  Korg Pa arrangers play the GM bank on channels 1-16. Drum kits are on channel 10.
  Korg factory voices use bank select; add a sound add-on with the voice list of
  your model to use them.

