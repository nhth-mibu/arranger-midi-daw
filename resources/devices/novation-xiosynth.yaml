# Sound editor: the XioSynth takes its sound settings as controllers (CC)
# and NRPNs (MSB 0) on the Synth MIDI channel, from the MIDI chart. Signed
# values use 64 as zero. NRPNs 104-106 are switches: the value picks both
# the setting and its state. Turning a knob on the XioSynth moves the knob
# in the editor too.
editor:
  pages:
    - name: "Oscillator 1"
      params:
        - { name: "Waveform", nrpn: 50, max: 31 }
        - { name: "Octave", nrpn: 105, choices: ["-1", "0", "+1", "+2"], values: [16, 17, 18, 19] }
        - { name: "Semitone", cc: 40, min: 52, max: 76, offset: -64 }
        - { name: "Cents", cc: 41, min: 14, max: 114, offset: -64 }
        - { name: "Bend Wheel Pitch", cc: 42, offset: -64 }
        - { name: "LFO 1 Pitch", cc: 43, offset: -64 }
        - { name: "Mod Env Pitch", cc: 44, offset: -64 }
        - { name: "Pulse Width Position", cc: 45, offset: -64 }
        - { name: "LFO 2 PW Mod", cc: 46, offset: -64 }
        - { name: "Mod Env PW Mod", cc: 47, offset: -64 }
    - name: "Oscillator 2"
      params:
        - { name: "Waveform", nrpn: 51, max: 31 }
        - { name: "Octave", nrpn: 105, choices: ["-1", "0", "+1", "+2"], values: [20, 21, 22, 23] }
        - { name: "Semitone", cc: 48, min: 52, max: 76, offset: -64 }
        - { name: "Cents", cc: 49, min: 14, max: 114, offset: -64 }
        - { name: "Bend Wheel Pitch", cc: 50, offset: -64 }
        - { name: "LFO 1 Pitch", cc: 51, offset: -64 }
        - { name: "Mod Env Pitch", cc: 52, offset: -64 }
        - { name: "Pulse Width Position", cc: 53, offset: -64 }
        - { name: "LFO 2 PW Mod", cc: 54, offset: -64 }
        - { name: "Mod Env PW Mod", cc: 55, offset: -64 }
    - name: "Oscillator 3"
      params:
        - { name: "Waveform", nrpn: 52, max: 31 }
        - { name: "Octave", nrpn: 105, choices: ["-1", "0", "+1", "+2"], values: [24, 25, 26, 27] }
        - { name: "Semitone", cc: 56, min: 52, max: 76, offset: -64 }
        - { name: "Cents", cc: 57, min: 14, max: 114, offset: -64 }
        - { name: "Bend Wheel Pitch", cc: 58, offset: -64 }
        - { name: "LFO 1 Pitch", cc: 59, offset: -64 }
        - { name: "Mod Env Pitch", cc: 60, offset: -64 }
        - { name: "Pulse Width Position", cc: 61, offset: -64 }
        - { name: "LFO 2 PW Mod", cc: 62, offset: -64 }
        - { name: "Mod Env PW Mod", cc: 63, offset: -64 }
    - name: "Oscillators Common"
      params:
        - { name: "Poly Mode", nrpn: 105, choices: ["Mono", "Mono AG", "Poly 1", "Poly 2"], values: [0, 1, 2, 3] }
        - { name: "Unison", nrpn: 106, choices: ["Off", "2", "3", "4", "5", "6", "7", "8"], values: [0, 1, 2, 3, 4, 5, 6, 7] }
        - { name: "Unison Detune", cc: 68 }
        - { name: "Random Detune", cc: 69 }
        - { name: "Osc 1>2 Sync", nrpn: 104, choices: ["Off", "On"], values: [10, 11] }
        - { name: "Portamento Time", cc: 5 }
        - { name: "Portamento Mode", cc: 70, choices: ["Exponential", "Linear"] }
        - { name: "Preglide", cc: 8, min: 52, max: 76, offset: -64, unit: semitones }
        - { name: "FM 2>3 Fixed Level", nrpn: 0 }
        - { name: "FM 2>3 AD Env Depth", nrpn: 1, offset: -64 }
        - { name: "FM 2>3 LFO 1 Depth", nrpn: 78, offset: -64 }
        - { name: "Keysync Start Phase", nrpn: 69, max: 120, unit: x3 deg }
        - { name: "Fixed Note", nrpn: 74, max: 127 }
    - name: "Mixer"
      params:
        - { name: "Osc 1 Level", cc: 72 }
        - { name: "Osc 2 Level", cc: 73 }
        - { name: "Osc 3 Level", cc: 74 }
        - { name: "Noise Level", cc: 75 }
        - { name: "Ring Mod 1x2 Level", cc: 76 }
        - { name: "Noise Type", nrpn: 70, choices: ["White", "High pass", "Band pass", "HP x BP"] }
        - { name: "Osc 1 LFO 1 Level Mod", nrpn: 63, offset: -64 }
        - { name: "Osc 2 LFO 2 Level Mod", nrpn: 64, offset: -64 }
        - { name: "Osc 3 AD Env Level Mod", nrpn: 65, offset: -64 }
        - { name: "Noise LFO 1 Level Mod", nrpn: 66, offset: -64 }
        - { name: "Ring LFO 1 Level Mod", nrpn: 67, offset: -64 }
        - { name: "Mix Output Level", cc: 119 }
    - name: "Filter"
      params:
        - { name: "Type", nrpn: 62, choices: ["Low pass", "Band pass", "High pass"] }
        - { name: "Shape", nrpn: 36 }
        - { name: "Frequency", cc: 105 }
