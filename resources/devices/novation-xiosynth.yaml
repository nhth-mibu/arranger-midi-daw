        - { name: "Mod Decay", cc: 115 }
        - { name: "Mod Sustain", cc: 116 }
        - { name: "Mod Release", cc: 117 }
        - { name: "Mod Velocity", cc: 118, offset: -64 }
        - { name: "AD Attack", nrpn: 3 }
        - { name: "AD Decay", nrpn: 4 }
        - { name: "AD Velocity", nrpn: 2, offset: -64 }
    - name: "LFOs"
      params:
        - { name: "LFO 1 Waveform", nrpn: 53, max: 31 }
        - { name: "LFO 1 Speed", cc: 80 }
        - { name: "LFO 1 Sync Speed", cc: 81, max: 34 }
        - { name: "LFO 1 Delay", cc: 82 }
        - { name: "LFO 1 Keysync", nrpn: 104, choices: ["Off", "On"], values: [18, 19] }
        - { name: "LFO 1 One-shot", nrpn: 104, choices: ["Off", "On"], values: [16, 17] }
        - { name: "LFO 1 Unipolar", nrpn: 55, choices: ["Centre zero", "All positive"] }
        - { name: "LFO 2 Waveform", nrpn: 54, max: 31 }
        - { name: "LFO 2 Speed", cc: 83 }
