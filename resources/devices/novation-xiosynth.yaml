        - { name: "Reverb Send", cc: 91 }
        - { name: "Reverb Type", nrpn: 106, choices: ["Chamber", "Small room", "Large room", "Small hall", "Large hall", "Grand hall"], values: [8, 9, 10, 11, 12, 13] }
        - { name: "Reverb Decay", cc: 25 }
        - { name: "Chorus Send", cc: 93 }
        - { name: "Chorus Type", nrpn: 104, choices: ["Chorus", "Phaser"], values: [34, 35] }
