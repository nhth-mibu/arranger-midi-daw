# Novation XioSynth 25/49. Controller numbers from the XioSynth MIDI chart.
# The XioSynth ignores CC 7 (it only sends it), so the mixer fader uses
# CC 119 (mix output level) instead. Patches are picked by bank (CC 32: 0 = A,
# 1 = B) and program number; the chart has no patch names, so they are numbered.
profile: 1
id: novation-xiosynth
name: Novation XioSynth
maker: Novation
dialect: none
ports: ["XioSynth", "Xio"]
drumChannels: []
programBase: 1
mixer: { volume: 119, pan: 10, reverb: 91, chorus: 93 }
notes: >
  Common parameters use the Synth MIDI channel set in the XioSynth's Global menu.

