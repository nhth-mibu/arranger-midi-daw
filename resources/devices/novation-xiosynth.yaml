# Novation XioSynth 25/49. Controller numbers from the XioSynth MIDI chart.
# The XioSynth ignores CC 7 (it only sends it), so the mixer fader uses
# CC 119 (mix output level) instead. Patches are picked by bank (CC 32: 0 = A,
# 1 = B) and program change 0-99: 100 patches in each bank. The names are the
# factory patches, read from Novation's factory bank dumps (Sound Bank1/2
# XIO_2106.syx): one 270-byte SysEx message per patch, byte 11 = bank (1, 2),
# byte 12 = patch number, 16-character ASCII name at byte 164. If the user
# saved over a factory patch, rename it in the sound list file.
profile: 1
id: novation-xiosynth
name: Novation XioSynth
maker: Novation
dialect: none
ports: ["XioSynth", "Xio"]
drumChannels: []
programBase: 1
mixer: { volume: 119, pan: 10, reverb: 91, chorus: 93 }
# 8 voices, one part: a 3-oscillator subtractive synth (the MIDI chart doesn't
# give the polyphony; confirmed by an owner).
capabilities: { polyphony: 8, parts: 1, lowest: 0, highest: 127, source: "owner: 8 voices" }
notes: >
  Common parameters use the Synth MIDI channel set in the XioSynth's Global menu.

