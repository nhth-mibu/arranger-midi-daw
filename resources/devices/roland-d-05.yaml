# Sound editor: the D-05 takes its sound settings as Roland SysEx (model 14H,
# the D-50's). Addresses are from the Parameter Guide's MIDI Implementation:
# the temporary area holds the sound that plays now. "Get sounds from the
# synth" reads the patch names of the Internal banks from the work area.
editor:
  sysex:
    write: "F0 41 {dev} 14 12 {addr} {value} {sum} F7"
    read: "F0 41 {dev} 14 11 {addr} {size} {sum} F7"
    device: channel
    addressBytes: 3
    sizeBytes: 3
  sections:
    partial:
        - { name: "Pitch Coarse", at: "00", max: 72, noteFrom: C1, default: 36 }
        - { name: "Pitch Fine", at: "01", max: 100, offset: -50, unit: cent }
        - { name: "Pitch Keyfollow", at: "02", choices: ["-1", "-1/2", "-1/4", "0", "1/8", "1/4", "3/8", "1/2", "5/8", "3/4", "7/8", "1", "5/4", "3/2", "2", "s1", "s2"] }
        - { name: "LFO Mode", at: "03", choices: ["Off", "(+)", "(-)", "A&L"] }
        - { name: "P-ENV Mode", at: "04", choices: ["Off", "(+)", "(-)"] }
        - { name: "Bender Mode", at: "05", choices: ["Off", "Keyfollow", "Normal"] }
        - { name: "Waveform", at: "06", choices: ["Square", "Sawtooth"] }
        - { name: "PCM Wave", at: "07", max: 99, offset: 1 }
        - { name: "Pulse Width", at: "08", max: 100 }
        - { name: "PW Velocity Range", at: "09", max: 14, offset: -7 }
        - { name: "PW LFO Select", at: "0A", choices: ["+1", "-1", "+2", "-2", "+3", "-3"] }
        - { name: "PW LFO Depth", at: "0B", max: 100 }
        - { name: "PW Aftertouch Range", at: "0C", max: 14, offset: -7 }
        - { name: "TVF Cutoff", at: "0D", max: 100 }
        - { name: "TVF Resonance", at: "0E", max: 30 }
        - { name: "TVF Keyfollow", at: "0F", choices: ["-1", "-1/2", "-1/4", "0", "1/8", "1/4", "3/8", "1/2", "5/8", "3/4", "7/8", "1", "5/4", "3/2", "2"] }
        - { name: "TVF Bias Point", at: "10", choices: ["<A1", "<A#1", "<B1", "<C2", "<C#2", "<D2", "<D#2", "<E2", "<F2", "<F#2", "<G2", "<G#2", "<A2", "<A#2", "<B2", "<C3", "<C#3", "<D3", "<D#3", "<E3", "<F3", "<F#3", "<G3", "<G#3", "<A3", "<A#3", "<B3", "<C4", "<C#4", "<D4", "<D#4", "<E4", "<F4", "<F#4", "<G4", "<G#4", "<A4", "<A#4", "<B4", "<C5", "<C#5", "<D5", "<D#5", "<E5", "<F5", "<F#5", "<G5", "<G#5", "<A5", "<A#5", "<B5", "<C6", "<C#6", "<D6", "<D#6", "<E6", "<F6", "<F#6", "<G6", "<G#6", "<A6", "<A#6", "<B6", "<C7", ">A1", ">A#1", ">B1", ">C2", ">C#2", ">D2", ">D#2", ">E2", ">F2", ">F#2", ">G2", ">G#2", ">A2", ">A#2", ">B2", ">C3", ">C#3", ">D3", ">D#3", ">E3", ">F3", ">F#3", ">G3", ">G#3", ">A3", ">A#3", ">B3", ">C4", ">C#4", ">D4", ">D#4", ">E4", ">F4", ">F#4", ">G4", ">G#4", ">A4", ">A#4", ">B4", ">C5", ">C#5", ">D5", ">D#5", ">E5", ">F5", ">F#5", ">G5", ">G#5", ">A5", ">A#5", ">B5", ">C6", ">C#6", ">D6", ">D#6", ">E6", ">F6", ">F#6", ">G6", ">G#6", ">A6", ">A#6", ">B6", ">C7"] }
        - { name: "TVF Bias Level", at: "11", max: 14, offset: -7 }
        - { name: "TVF ENV Depth", at: "12", max: 100 }
        - { name: "TVF ENV Velocity", at: "13", max: 100 }
        - { name: "TVF ENV Depth Keyfollow", at: "14", max: 4 }
        - { name: "TVF ENV Time Keyfollow", at: "15", max: 4 }
        - { name: "TVF ENV Time 1", at: "16", max: 100 }
        - { name: "TVF ENV Time 2", at: "17", max: 100 }
        - { name: "TVF ENV Time 3", at: "18", max: 100 }
        - { name: "TVF ENV Time 4", at: "19", max: 100 }
        - { name: "TVF ENV Time 5", at: "1A", max: 100 }
