# Roland Boutique D-05. Preset patch names and bank numbers from the D-05
# Parameter Guide (Sound List and MIDI Implementation). Bank MSB 87,
# LSB 8-13 = Preset 1-6, program 1-64 = patch 11-88. User banks (LSB 0-7)
# hold your own patches, so they aren't listed.
profile: 1
id: roland-d-05
name: Roland D-05
maker: Roland
dialect: none
ports: ["D-05"]
drumChannels: []
programBase: 1
# The D-05 takes volume (CC 7) but not pan, reverb or chorus by controller.
mixer: { volume: 7, pan: none, reverb: none, chorus: none }
notes: >
  One part, on the D-05's MIDI channel (set in its SYSTEM menu). Program Change
  Switch must be on to receive sounds.

