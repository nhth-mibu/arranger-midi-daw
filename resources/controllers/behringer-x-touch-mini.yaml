# Behringer X-Touch Mini in standard mode (MC MODE light off), factory layers
# A and B on MIDI channel 11. The Quick Start Guide doesn't print the message
# numbers; these are the factory defaults (encoders CC 1-8 / 11-18, fader CC 9 /
# 10, buttons as notes). If you changed them in the X-TOUCH editor, restore the
# factory preset or edit this file.
controller: 1
id: behringer-x-touch-mini
name: Behringer X-Touch Mini
maker: Behringer
ports: ["X-TOUCH MINI"]
channel: 0          # the whole port is the controller
strips: 8
notes: >
  Layer A: top and bottom buttons start the clips in the two scene rows after
  the Launchkey pads. Knobs are volume, pressing a knob selects the track.
  Layer B: knobs are pan, top buttons mute, bottom buttons solo. The fader is
  the master level on both layers.

controls:
  # Layer A: clips, 8 tracks wide and 2 scenes high (the two rows after Launchkey).
  - { note: 8,  channel: 11, count: 8, action: launchClip, row: 2 }   # top buttons
  - { note: 16, channel: 11, count: 8, action: launchClip, row: 3 }   # bottom buttons
  - { cc: 1,    channel: 11, count: 8, action: volume }
  - { note: 0,  channel: 11, count: 8, action: select }
  - { cc: 9,    channel: 11, action: masterVolume }
  # Layer B: mixer.
  - { cc: 11,   channel: 11, count: 8, action: pan }
  - { note: 24, channel: 11, count: 8, action: panCentre }
  - { note: 32, channel: 11, count: 8, action: mute }
  - { note: 40, channel: 11, count: 8, action: solo }
  - { cc: 10,   channel: 11, action: masterVolume }

# Buttons light in step with the clips on Layer A.
pads:
  channel: 11
  empty: 0
  clip: 127
  playing: 127
  waiting: 127
