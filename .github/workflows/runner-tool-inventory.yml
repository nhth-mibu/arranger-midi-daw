name: Windows and Linux runner inventory

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Skip the Linux inventory
        type: boolean
        default: false

permissions: {}

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, ci-windows-x64]
    timeout-minutes: 5
    steps:
      - name: Account, tools, and Visual Studio
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          whoami
          Write-Output "Home: $env:USERPROFILE"
          Write-Output "Workspace: $env:GITHUB_WORKSPACE"
          Write-Output "Architecture: $env:RUNNER_ARCH"
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Expected x64 runner' }
          foreach ($tool in @('git', 'cmake', 'ninja', 'ccache', 'sccache', 'clang', 'cl', 'pwsh')) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) {
              Write-Output "$tool : $($found.Source)"
              if ($tool -ne 'cl') { & $found.Source --version 2>&1 | Select-Object -First 3 }
            } else { Write-Output "MISSING FROM PATH: $tool" }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json
          } else { Write-Output 'MISSING: Visual Studio Installer vswhere' }
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue | Select-Object PSChildName
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          Write-Output "Administrator token: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          $global:LASTEXITCODE = 0

      - name: Inspect installed tools outside PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio C++ installation found' }
          $candidates = @(
            "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe",
            "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe",
            "$env:ProgramFiles\CMake\bin\cmake.exe",
            "$env:ProgramFiles\Ninja\ninja.exe",
            "$env:ProgramFiles\ccache\ccache.exe",
            "$env:ProgramFiles\sccache\sccache.exe",
            'C:\tools\ninja\ninja.exe',
            'C:\tools\ccache\ccache.exe',
            'C:\tools\sccache\sccache.exe',
            'C:\ProgramData\chocolatey\bin\cmake.exe',
            'C:\ProgramData\chocolatey\bin\ninja.exe',
            'C:\ProgramData\chocolatey\bin\ccache.exe',
            'C:\ProgramData\chocolatey\bin\sccache.exe'
          )
          foreach ($path in $candidates) {
            if (Test-Path -LiteralPath $path) {
              Write-Output "FOUND: $path"
              & $path --version
            } else { Write-Output "NOT FOUND: $path" }
          }
          $registryRoots = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          Get-ItemProperty $registryRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'CMake|Ninja|ccache|sccache' } |
            Select-Object DisplayName, DisplayVersion, InstallLocation | Format-List
          $global:LASTEXITCODE = 0

      - name: Verify MSVC developer environment
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          where link
          if errorlevel 1 exit /b 1
          where rc
          if errorlevel 1 exit /b 1
          cl /Bv 2>&1
          rem cl without a source file reports its version and returns nonzero.
          exit /b 0

  linux:
    if: ${{ !inputs.windows_only }}
    runs-on: [self-hosted, Linux, X64, ci-linux-x64]
    timeout-minutes: 5
    steps:
      - name: Account, tools, packages, and WSL service
        shell: bash
        run: |
          set -eu
          id
          printf 'Home: %s\nWorkspace: %s\n' "$HOME" "$GITHUB_WORKSPACE"
          test "$RUNNER_ARCH" = X64
          uname -sm
          cat /etc/os-release
          stat -c '%a %U:%G %n' "$HOME" "$RUNNER_WORKSPACE"
          for tool in git cmake ninja ccache sccache gcc g++ clang pkg-config; do
            if command -v "$tool"; then
              "$tool" --version | sed -n '1,3p'
            else
              printf 'MISSING FROM PATH: %s\n' "$tool"
            fi
          done
          if command -v pkg-config >/dev/null; then
            for package in alsa jack freetype2 fontconfig x11 xcomposite xcursor xext xinerama xrandr xrender gl; do
              if version="$(pkg-config --modversion "$package" 2>/dev/null)"; then
                printf '%s: %s\n' "$package" "$version"
              else
                printf 'MISSING DEVELOPMENT PACKAGE: %s\n' "$package"
              fi
            done
          fi
          command -v xvfb-run || true
          printf 'PID 1: '
          ps -p 1 -o comm=
          if command -v systemctl >/dev/null; then
            systemctl list-unit-files 'actions.runner.*' --no-pager || true
          fi
          if test -f /etc/wsl.conf; then
            sed -n '/^\[boot\]/,/^\[/p' /etc/wsl.conf
          fi
          printf '\nRunner service restrictions:\n'
          systemctl show actions.runner.nhth-mibu-arranger-midi-daw.wsl-9950x.service \
            -p SystemCallFilter -p SystemCallErrorNumber -p RestrictFileSystems \
            -p ProtectSystem -p ReadWritePaths -p NoNewPrivileges || true
          printf '\nFilesystem and archive tools:\n'
          findmnt -T "$RUNNER_WORKSPACE" || true
          tar --version
          printf '\nArchive extraction probe:\n'
          probe="$(mktemp -d "$RUNNER_TEMP/archive-probe.XXXXXX")"
          mkdir "$probe/source" "$probe/destination"
          printf 'probe\n' > "$probe/source/file"
          tar -czf "$probe/probe.tar.gz" -C "$probe/source" .
          tar -xzf "$probe/probe.tar.gz" -C "$probe/destination"
          cat "$probe/destination/file"
          printf '\nKernel and openat2 support:\n'
          uname -r
          grep -E '^(Seccomp|NoNewPrivs)' /proc/self/status
          if command -v python3 >/dev/null; then
            python3 -c 'import ctypes, os; libc=ctypes.CDLL(None, use_errno=True); how=(ctypes.c_ulonglong*3)(0,0,0); fd=libc.syscall(437,-100,b".",ctypes.byref(how),24); print("openat2 result:", fd, "errno:", ctypes.get_errno()); os.close(fd) if fd >= 0 else None'
          fi
          mkdir "$probe/source/nested"
          printf 'nested probe\n' > "$probe/source/nested/file"
          tar -czf "$probe/nested.tar.gz" -C "$probe/source" .
          tar -xzf "$probe/nested.tar.gz" -C "$probe/destination"
