name: Windows compiler cache setup

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-cache-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: [self-hosted, Windows, X64, ci-windows-x64]
    timeout-minutes: 10
    steps:
      - name: Install verified sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TOOL_CACHE 'sccache\0.19.0\x64'
          $stage = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $stage | Out-Null
          $zip = Join-Path $stage 'sccache.zip'
          Invoke-WebRequest -Uri 'https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip' -OutFile $zip
          $expected = '28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Archive SHA-256 mismatch'
          }
          Write-Output 'Archive SHA-256 verified'
          Expand-Archive -LiteralPath $zip -DestinationPath $stage
          $source = Join-Path $stage 'sccache-v0.19.0-x86_64-pc-windows-msvc\sccache.exe'
          if (-not (Test-Path $source)) { throw 'Expected executable missing from archive' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $exe = Join-Path $root 'sccache.exe'
          if (Test-Path $exe) {
            if ((Get-FileHash $exe).Hash -ne (Get-FileHash $source).Hash) {
              throw 'Existing installation differs; refusing to overwrite'
            }
          } else { Copy-Item -LiteralPath $source -Destination $exe }
          $cache = Join-Path $env:RUNNER_TOOL_CACHE 'sccache-data'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "SCCACHE_EXE=$exe" >> $env:GITHUB_ENV
          "SCCACHE_DIR=$cache" >> $env:GITHUB_ENV
          'SCCACHE_CACHE_SIZE=5G' >> $env:GITHUB_ENV
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'sccache failed to start' }
          'int cache_probe(int x) { return x * 2; }' | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'sccache-probe.cpp')
          Write-Output "Installed: $exe"
          Write-Output "Cache: $cache"

      - name: Compile twice using MSVC and sccache
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          "%SCCACHE_EXE%" cl /nologo /c /O2 /Z7 "%RUNNER_TEMP%\sccache-probe.cpp" /Fo"%RUNNER_TEMP%\sccache-probe.obj"
          if errorlevel 1 exit /b 1
          "%SCCACHE_EXE%" cl /nologo /c /O2 /Z7 "%RUNNER_TEMP%\sccache-probe.cpp" /Fo"%RUNNER_TEMP%\sccache-probe.obj"
          if errorlevel 1 exit /b 1
          "%SCCACHE_EXE%" --show-stats

      - name: Stop cache server
        if: always() && env.SCCACHE_EXE != ''
        shell: pwsh
        run: |
          & $env:SCCACHE_EXE --stop-server
          if ($LASTEXITCODE -ne 0) { throw 'Could not stop sccache server' }
