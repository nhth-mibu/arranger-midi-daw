name: Purge green run logs

# Deletes the logs of green runs. Failed and cancelled runs keep their logs
# so they can be debugged. Artifacts and caches are not touched.
#
# Note: logs do not count toward the Actions storage limit (artifacts and
# caches do), so this only tidies the run history.
#
# Runs once a day for the green runs of the last 3 days: one short job a day,
# not one per finished run, to save Actions minutes. Run it by hand
# (Actions > Purge green run logs > Run workflow) to purge the logs of all
# earlier green runs once.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            // Treat "already gone" (404) as done.
            const del = async (run_id) => {
              try { await github.rest.actions.deleteWorkflowRunLogs({ owner, repo, run_id }); return true; }
              catch (e) { if (e.status === 404) return false; throw e; }
            };
            // Daily: the green runs of the last 3 days. By hand: every earlier green run.
            const query = { owner, repo, status: "success", per_page: 100 };
            if (context.eventName === "schedule") {
              const since = new Date(Date.now() - 3 * 24 * 3600 * 1000).toISOString().slice(0, 10);
              query.created = `>=${since}`;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, query);
            let n = 0;
            for (const r of runs) {
              if (r.id === context.runId) continue;
              if (await del(r.id)) n++;
            }
            core.info(`deleted logs of ${n} green runs`);
            await core.summary.addHeading("Purge green run logs").addRaw(`Deleted logs of ${n} green runs.`).write();
