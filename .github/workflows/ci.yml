name: CI

# Runs on the always-on Mac mini runner, so it uses no hosted minutes.
# Windows and Linux build on demand: see x64-builds.yml and docs/ci-self-hosted.md.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: App and tests (macOS)
    runs-on: [self-hosted, macOS, ARM64, ci-macos-arm64]
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare build environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          command -v cmake ninja ccache clang
          echo "BUILD_DIR=$HOME/ci-builds/arranger-midi-daw/macos-arm64-release" >> "$GITHUB_ENV"

      - name: Core and engine stay JUCE-free
        run: ./scripts/check-no-juce.sh

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DARRANGER_BUILD_APP=ON \
            -DARRANGER_BUILD_TESTS=ON \
            -DARRANGER_BUILD_TEST_PLUGINS=ON \
            -DARRANGER_WARNINGS_AS_ERRORS=ON

      - name: Build app and tests
        run: cmake --build "$BUILD_DIR" --parallel 6

      - name: Run tests
        run: ctest --test-dir "$BUILD_DIR" -C Release --output-on-failure --no-tests=error --timeout 120

      - name: Screenshots
        # Renders the window off-screen to PNG with the demo project, no audio device needed.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app="$BUILD_DIR/src/app/ArrangerMidiDaw_artefacts/Release/Arranger MIDI DAW.app"
          exe="$app/Contents/MacOS/Arranger MIDI DAW"
          test -x "$exe"
          rm -rf screenshots && mkdir -p screenshots
          for theme in dark light; do
            "$exe" --screenshot "screenshots/macOS-$theme.png" --theme $theme --position 20160 examples/demo.arranger
            "$exe" --screenshot "screenshots/macOS-$theme-editor.png" --theme $theme --position 6000 --editor examples/demo.arranger
            "$exe" --screenshot "screenshots/macOS-$theme-mixer.png" --theme $theme --mixer --position 20160 examples/demo.arranger
            "$exe" --screenshot "screenshots/macOS-$theme-beat.png" --theme $theme --view beat --position 2000 examples/demo.arranger
            "$exe" --screenshot "screenshots/macOS-$theme-clips.png" --theme $theme --view clips examples/demo.arranger
            "$exe" --screenshot "screenshots/macOS-$theme-score.png" --theme $theme --view score --track Piano examples/demo.arranger
          done
          "$exe" --screenshot "screenshots/macOS-slicer.png" --slice examples/demo-loop.wav examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-audio.png" --audio examples/demo-loop.wav --audio-to-midi drums examples/demo.arranger
          # Other audio formats: FLAC through the app's own reader, MP3 through the reader of macOS.
          "$exe" --screenshot "screenshots/macOS-audio-flac.png" --audio examples/demo-loop.flac examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-audio-mp3.png" --audio examples/demo-loop.mp3 examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-buses.png" --buses --mixer-height 420 examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-shortcuts.png" --shortcuts examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-automation.png" --track Piano --automation volume examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-grid-audio.png" --view clips --grid-audio examples/demo-loop.wav examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-style-fill.png" --fill-style examples/demo-style.sty --fill-chords "Cm Ab Eb Bb" --mixer examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-score-full.png" --view score --mixer-height 200 examples/demo.arranger
          "$exe" --export-pdf "screenshots/macOS-score-full.pdf" examples/demo.arranger
          "$exe" --export-pdf "screenshots/macOS-score-lead.pdf" --track Lead examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-score-input.png" --view score --track Lead --score-keys "n5cde4fg6.a" examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-score-marks.png" --view score --track Lead --score-marks examples/demo.arranger
          "$exe" --export-musicxml "screenshots/macOS-demo.musicxml" examples/demo.arranger
          "$exe" --screenshot "screenshots/macOS-musicxml-import.png" --view score --track Piano "screenshots/macOS-demo.musicxml"
          ls -la screenshots

      - name: Audio analysis (stems, notes, chords, instruments, lyrics)
        # The tools and models stay in a HOME of their own, so the runner user's app data is not touched.
        # The first run downloads about 2 GB; later runs reuse them.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export HOME="$HOME/ci-cache/analysis-home"
          export CFFIXED_USER_HOME="$HOME" # the app finds its home with NSHomeDirectory(), which ignores HOME
          mkdir -p "$HOME"
          scripts/install-analysis-tools.sh base
          py="$HOME/Library/Arranger MIDI DAW/Python/bin/python"
          exe="$BUILD_DIR/src/app/ArrangerMidiDaw_artefacts/Release/Arranger MIDI DAW.app/Contents/MacOS/Arranger MIDI DAW"
          # A spoken line (macOS speech) over the demo loop: Demucs must find the voice, Whisper the words.
          say -o "$RUNNER_TEMP/voice.aiff" "Copper lights are shining on the river tonight. We sing along until the morning comes."
          "$py" -I - "$RUNNER_TEMP/voice.aiff" examples/demo-loop.wav "$RUNNER_TEMP/mix.wav" <<'PY'
          import sys, numpy as np, soundfile as sf, librosa
          voice, _ = librosa.load(sys.argv[1], sr=44100, mono=True)
          loop, _ = librosa.load(sys.argv[2], sr=44100, mono=True)
          music = np.tile(loop, int(np.ceil((len(voice) + 44100) / len(loop))))[: len(voice) + 44100]
          mix = 0.35 * music
          mix[22050 : 22050 + len(voice)] += 0.9 * voice
          sf.write(sys.argv[3], np.stack([mix, mix], axis=1), 44100)
          PY
          mkdir -p screenshots
          "$exe" --audio "$RUNNER_TEMP/mix.wav" --analyse all --language en --size 1600x1000 \
            --screenshot screenshots/macOS-analysis.png examples/demo.arranger | tee "$RUNNER_TEMP/analysis.txt"
          "$exe" --audio "$RUNNER_TEMP/mix.wav" --analyse chords --analysis-view --screenshot screenshots/macOS-analysis-window.png examples/demo.arranger
          grep -q "Stem tracks: 4" "$RUNNER_TEMP/analysis.txt"
          grep -qi "river" "$RUNNER_TEMP/analysis.txt"

      - name: Ad-hoc sign and package ZIP and DMG
        timeout-minutes: 5
        run: |
          bash scripts/package-macos.sh \
            "$BUILD_DIR/src/app/ArrangerMidiDaw_artefacts/Release/Arranger MIDI DAW.app" \
            "$RUNNER_TEMP/macos-packages"

      - name: Upload screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screenshots-macOS
          path: |
            screenshots/*.png
            screenshots/*.pdf
            screenshots/*.musicxml
          retention-days: 7

      - name: Upload the macOS app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArrangerMidiDaw-macOS
          path: ${{ runner.temp }}/macos-packages/*
          if-no-files-found: error
          retention-days: 7

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
